<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the major battles of World War II through an interactive timeline of events.">
    <title>Echoes of Conflict: WWII Major Battles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-overlay"></div>
    <header class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Echoes of Conflict</h1>
            <p class="hero-subtitle">Exploring the Major Battles of World War II</p>
            <div class="scroll-indicator">
                <span>Discover the History</span>
                <div class="mouse"></div>
            </div>
        </div>
    </header>

    <main class="timeline-container">
        <section id="battles-grid" class="battles-grid">
            <!-- Cards will be dynamically injected here by script.js -->
        </section>
    </main>

    <!-- Modal for deeper dive -->
    <div id="battle-modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass">
            <button id="close-modal" class="close-btn" aria-label="Close modal">&times;</button>
            <img id="modal-img" src="" alt="Battle Image" class="modal-hero-image">
            <div class="modal-body">
                <span class="modal-date" id="modal-date"></span>
                <h2 id="modal-title" class="modal-title"></h2>
                <div class="modal-stats">
                    <div class="stat"><span class="stat-label">Location:</span> <span id="modal-location"></span></div>
                    <div class="stat"><span class="stat-label">Result:</span> <span id="modal-result"></span></div>
                </div>
                <div class="modal-description" id="modal-description"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>A historical exploration project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
