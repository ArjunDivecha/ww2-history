<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the major battles of World War II through an interactive timeline of events.">
    <title>Echoes of Conflict: WWII Major Battles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-overlay"></div>
    <header class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Echoes of Conflict</h1>
            <p class="hero-subtitle">Exploring the Major Battles of World War II</p>
            <div class="scroll-indicator">
                <span>Discover the History</span>
                <div class="mouse"></div>
            </div>
        </div>
    </header>

    <main class="timeline-container">
        <section id="battles-grid" class="battles-grid">
            <!-- Cards will be dynamically injected here by script.js -->
        </section>
    </main>

    <!-- Detailed pages are loaded dynamically via script.js links -->

    <footer>
        <p>A historical exploration project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
